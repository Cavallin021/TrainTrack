version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: traintrack-db
    restart: always
    environment:
      POSTGRES_USER: adminTT
      POSTGRES_PASSWORD: adminTT
      POSTGRES_DB: traintrack
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
